<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 16-32 px cut: full-bleed tile, heavier rim, mark enlarged, no glow, traces or sheen. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.35" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.3" stop-color="#fde68a"/>
      <stop offset="0.7" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1d2d4c"/>
      <stop offset="0.55" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#060b17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="url(#rim)" stroke-width="12"/>
  <g transform="translate(250 260) scale(1.18) translate(-250 -260)">
    <g stroke-linejoin="round" stroke-width="4">
      <path d="M238 104 H302 L160 416 H96 Z" fill="url(#sky)" stroke="url(#sky)"/>
      <path d="M334 104 H404 L342 240 H384 L250 416 L294 276 H256 Z" fill="url(#amber)" stroke="url(#amber)"/>
    </g>
  </g>
</svg>
