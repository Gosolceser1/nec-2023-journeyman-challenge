  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g stroke-linejoin="round" stroke-width="4">
    <path d="M238 104 H302 L160 416 H96 Z" fill="url(#sky)" stroke="url(#sky)"/>
    <path d="M334 104 H404 L342 240 H384 L250 416 L294 276 H256 Z" fill="url(#amber)" stroke="url(#amber)"/>
    <path d="M244 112 H296 M340 112 H396" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
