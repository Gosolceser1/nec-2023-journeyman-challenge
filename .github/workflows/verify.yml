name: verify

# Mirrors tools/verify.sh so the same checks run locally and in CI.
# The Godot binary is committed-out (see .gitignore); CI downloads it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    # A full run takes 15-25 minutes on the hosted Windows runner.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Godot version (tools/godot.env)
        shell: bash
        run: |
          . tools/godot.env
          { echo "GODOT_VERSION=$GODOT_VERSION"; echo "GODOT_BINARY=$GODOT_BINARY"; echo "GODOT_EDITOR=$GODOT_EDITOR"; } >> "$GITHUB_ENV"

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          # The console exe is a 200 KB wrapper that launches the editor exe
          # next to it, so both must be cached.
          path: |
            ${{ env.GODOT_EDITOR }}
            ${{ env.GODOT_BINARY }}
          key: godot-${{ env.GODOT_VERSION }}-win64-both

      - name: Download Godot (console build)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # The zip holds both the editor and the console wrapper; the wrapper
          # is not a separate release asset.
          $url = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/$env:GODOT_EDITOR.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath . -Force
          Remove-Item godot.zip
          foreach ($exe in $env:GODOT_EDITOR, $env:GODOT_BINARY) {
            if (-not (Test-Path $exe)) { throw "$exe missing from the release zip" }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The harness calls --script, which needs the editor binary, and
      # headless rendering must initialise. No display needed on the runner.
      - name: Verify (parse, unit, scene desktop, scene mobile, bank schema)
        shell: bash
        run: bash tools/verify.sh 2>&1 | tee verify.log

      - name: Archive verify output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify.log
          retention-days: 7
