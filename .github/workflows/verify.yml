name: verify

# Mirrors tools/verify.sh so the same checks run locally and in CI.
# The Godot binary is committed-out (see .gitignore); CI downloads it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          # The console exe is a 200 KB wrapper that launches the editor exe
          # next to it, so both must be cached.
          path: |
            Godot_v4.7.2-stable_win64.exe
            Godot_v4.7.2-stable_win64_console.exe
          key: godot-4.7.2-win64-both

      - name: Download Godot (console build)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # The zip holds both the editor and the console wrapper; the wrapper
          # is not a separate release asset.
          $url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath . -Force
          Remove-Item godot.zip
          foreach ($exe in "Godot_v4.7.2-stable_win64.exe", "Godot_v4.7.2-stable_win64_console.exe") {
            if (-not (Test-Path $exe)) { throw "$exe missing from the release zip" }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The harness calls --script, which needs the editor binary, and
      # headless rendering must initialise. No display needed on the runner.
      - name: Verify (parse, unit, scene desktop, scene mobile, bank schema)
        shell: bash
        run: bash tools/verify.sh 2>&1 | tee verify.log

      - name: Archive verify output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify.log
          retention-days: 7
