<text x="414.0" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">included: no added load</text>
<text x="414.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">circuits = VA / 1,800 (15 A x 120 V),</text>
<text x="414.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">round up</text>
