<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<rect x="0.0" y="0.0" width="800.0" height="520.0" rx="0" fill="#0f172a" fill-opacity="1.0" stroke="none" stroke-width="2"/>
<text x="400.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="middle">Conduit fill in three steps (Chapter 9)</text>
<circle cx="130.0" cy="190.0" r="90" fill="#0f172a" stroke="#64748b" stroke-width="12"/>
<circle cx="94.0" cy="160.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="130.0" cy="144.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="166.0" cy="160.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="84.0" cy="198.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="120.0" cy="190.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="156.0" cy="200.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="100.0" cy="234.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="138.0" cy="234.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<circle cx="174.0" cy="236.0" r="17" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
<text x="130.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0" text-anchor="middle">over 2 wires: 40%</text>
<text x="130.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#fbbf24" text-anchor="middle">nipple 24 in or</text>
<text x="130.0" y="368.2" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#fbbf24" text-anchor="middle">shorter: 60%</text>
<rect x="270.0" y="76.0" width="510.0" height="96.0" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="2"/>
<text x="284.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0" text-anchor="start">1. Table 5: one conductor's area</text>
<text x="284.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">by type and size (with insulation);</text>
<text x="284.0" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">area x how many = total</text>
<rect x="270.0" y="186.0" width="510.0" height="96.0" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="2"/>
<text x="284.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0" text-anchor="start">2. Table 4: the raceway column</text>
<text x="284.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">pick the raceway type and trade size,</text>
<text x="284.0" y="269.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">read its 40% (or 60%) area</text>
<rect x="270.0" y="296.0" width="510.0" height="148.0" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="2"/>
<text x="284.0" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0" text-anchor="start">3. Compare, or divide</text>
<text x="284.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">total &lt;= allowed area: it fits</text>
<text x="284.0" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">allowed - used = space left</text>
<text x="284.0" y="404.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">allowed / one area = how many</text>
<text x="284.0" y="429.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="start">(same size: .8 or more rounds up)</text>
<text x="30.0" y="414.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="start">Example: 10 #12 THHN</text>
<text x="30.0" y="437.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="start">in 3/4 EMT</text>
<text x="30.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="start">10 x 0.0133 = 0.133</text>
<text x="30.0" y="483.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="start">40% col. 0.213: fits</text>
</svg>
