<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
<rect x="0.0" y="0.0" width="800.0" height="420.0" rx="0" fill="#0f172a" fill-opacity="1.0" stroke="none" stroke-width="2"/>
<text x="400.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="middle">Correcting and adjusting a 90 C conductor</text>
<rect x="40.0" y="80.0" width="64.0" height="76.0" rx="5" fill="#334155" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="3"/>
<circle cx="72.0" cy="87.3" r="4.56" fill="#64748b" stroke="none" stroke-width="2"/>
<circle cx="72.0" cy="148.7" r="4.56" fill="#64748b" stroke="none" stroke-width="2"/>
<rect x="61.8" y="100.5" width="20.5" height="35.0" rx="2" fill="#0f172a" fill-opacity="1.0" stroke="#64748b" stroke-width="1.5"/>
<rect x="64.2" y="102.6" width="15.6" height="16.1" rx="2" fill="#e2e8f0" fill-opacity="1.0" stroke="none" stroke-width="2"/>
<text x="72.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0" text-anchor="middle">breaker lug</text>
<text x="72.0" y="210.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#fbbf24" text-anchor="middle">marked 75 C</text>
<line x1="104.0" y1="118.0" x2="560.0" y2="118.0" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-opacity="1.0"/>
<text x="330.0" y="102.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#e2e8f0" text-anchor="middle">#10 Cu THHN, 90 C insulation</text>
<rect x="560.0" y="88.0" width="70.0" height="60.0" rx="5" fill="#334155" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="3"/>
<text x="595.0" y="176.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">load</text>
<text x="330.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">4 current-carrying conductors in the raceway</text>
<rect x="20.0" y="232.0" width="760.0" height="160.0" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="2"/>
<text x="36.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="start">#10 Cu ampacity:  60 C = 30 A,  75 C = 35 A,  90 C = 40 A</text>
<text x="36.0" y="306.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="start">derate from the 90 C column:  40 A x 0.80 = 32 A</text>
<text x="36.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="start">check: 32 A is not over 35 A, the 75 C</text>
<text x="415.3" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#34d399" text-anchor="start">termination</text>
<text x="36.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="start">rating, so 32 A is allowed</text>
<rect x="615.6" y="38.0" width="170.4" height="36.0" rx="8" fill="#1e293b" fill-opacity="1.0" stroke="#64748b" stroke-width="2"/>
<text x="625.6" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="start">NEC 310.15(A)</text>
