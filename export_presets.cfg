[preset.3.options]

; One universal .app (Apple Silicon + Intel). Export to a .zip: a bare .app
; exported from Windows loses the executable bit. Built-in signing is ad-hoc
; (Apple Silicon runs nothing unsigned); no notarization without a paid
; Apple Developer ID. The bundle id is frozen in data/app.json.
binary_format/architecture="universal"
application/icon="res://assets/branding/source/png/icon_1024.png"
application/icon_interpolation=4
application/bundle_identifier="com.livewire.nec2023.trainer"
application/signature=""
application/app_category="Education"
